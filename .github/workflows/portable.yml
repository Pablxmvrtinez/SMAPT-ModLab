name: Paquetes portables
on:
  workflow_dispatch:
    inputs:
      edicion:
        description: 'Edición a construir'
        type: choice
        options: [ligera, completa]
        default: ligera
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bibliotecas del sistema para Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dependencias (edición ligera)
        if: inputs.edicion == 'ligera'
        run: python -m pip install -r requirements-lite.txt "pyinstaller>=6.16,<7"
      - name: Dependencias (edición completa)
        if: inputs.edicion == 'completa'
        env:
          CMAKE_ARGS: '-DGGML_NATIVE=OFF -DGGML_CUDA=OFF'
          CMAKE_BUILD_PARALLEL_LEVEL: '3'
        run: |
          python -m pip install -r requirements.txt "pyinstaller>=6.16,<7"
          python scripts/fetch_model.py
      - name: Pruebas
        run: python -m unittest discover -s tests -v
      - name: Construir portable
        env:
          SMAPT_CATALOG_URL: ${{ vars.SMAPT_CATALOG_URL }}
        shell: bash
        run: python build_portable.py ${{ inputs.edicion == 'ligera' && '--lite' || '' }}
      - name: Verificar ejecutable Linux
        if: runner.os == 'Linux'
        run: |
          name=${{ inputs.edicion == 'ligera' && 'SMAPT-ModLab-Lite' || 'SMAPT-ModLab' }}
          dist/$name/$name --smoke
      - name: Verificar ejecutable Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = if ('${{ inputs.edicion }}' -eq 'ligera') { 'SMAPT-ModLab-Lite' } else { 'SMAPT-ModLab' }
          $process = Start-Process -FilePath "dist/$name/$name.exe" -ArgumentList '--smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Guardar paquete
        uses: actions/upload-artifact@v4
        with:
          name: SMAPT-ModLab-${{ inputs.edicion }}-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
