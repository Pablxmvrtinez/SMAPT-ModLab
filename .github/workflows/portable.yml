name: Compilaciones públicas

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      edicion:
        description: 'Edición a construir'
        type: choice
        options: [publica, con-ia]
        default: publica

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      EDICION: ${{ inputs.edicion || 'publica' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bibliotecas de Qt en Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - name: Instalar dependencias (edición pública)
        if: env.EDICION == 'publica'
        run: python -m pip install -r requirements.txt "pyinstaller>=6.16,<7"
      - name: Instalar dependencias (edición con IA)
        if: env.EDICION == 'con-ia'
        env:
          CMAKE_ARGS: '-DGGML_NATIVE=OFF -DGGML_CUDA=OFF'
          CMAKE_BUILD_PARALLEL_LEVEL: '3'
        run: |
          python -m pip install -r requirements-ai.txt "pyinstaller>=6.16,<7"
          python scripts/fetch_model.py
      - name: Pruebas
        run: python -m unittest discover -s tests -v
      - name: Construir
        shell: bash
        env:
          SMAPT_CATALOG_URL: ${{ vars.SMAPT_CATALOG_URL }}
        run: |
          if [ "$EDICION" = "con-ia" ]; then python build_portable.py --with-ai; else python build_portable.py; fi
      - name: Comprobar ejecutable Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name=$([ "$EDICION" = "con-ia" ] && echo SMAPT-ModLab-IA || echo SMAPT-ModLab)
          dist/$name/$name --smoke
      - name: Comprobar ejecutable Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = if ($env:EDICION -eq 'con-ia') { 'SMAPT-ModLab-IA' } else { 'SMAPT-ModLab' }
          $p = Start-Process -FilePath "dist/$name/$name.exe" -ArgumentList '--smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Guardar paquetes descargables
        uses: actions/upload-artifact@v4
        with:
          name: SMAPT-ModLab-${{ env.EDICION }}-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SMAPT-ModLab-publica-*
          path: artifacts
          merge-multiple: true
      - name: Publicar descargas beta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" modlab/__init__.py)
          tag="v$version"
          ls -lh artifacts/
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/*.zip artifacts/*.tar.gz --clobber
          else
            gh release create "$tag" artifacts/*.zip artifacts/*.tar.gz \
              --target "$GITHUB_SHA" --title "SMAPT ModLab $version" --prerelease \
              --notes "Edición pública sin claves: explorar y exportar con Modrinth (.mrpack). CurseForge requiere acceso autorizado (clave propia o pasarela). La IA local no viene incluida en esta descarga."
          fi
