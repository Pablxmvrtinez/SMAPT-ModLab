name: Pruebas
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bibliotecas del sistema para Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dependencias (sin IA)
        run: python -m pip install -r requirements-lite.txt pyflakes
      - name: Análisis estático
        run: python -m pyflakes app.py catalog_server.py build_portable.py modlab scripts tests
      - name: Pruebas
        run: python -m unittest discover -s tests -v
      - name: Arranque de la interfaz
        run: python app.py --smoke
