name: Pruebas automáticas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar bibliotecas de Qt para Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0
      - name: Instalar dependencias para las pruebas
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.6,<7" "requests>=2.31,<3" "psutil>=5.9,<8"
      - name: Comprobar sintaxis
        run: python -m compileall -q app.py core.py curseforge.py intelligence.py local_ai.py modpack.py visual_widgets.py public_page.py public_catalog.py
      - name: Ejecutar pruebas de lógica e interfaz
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Comprobar que la interfaz arranca
        env:
          QT_QPA_PLATFORM: offscreen
        run: python app.py --smoke
