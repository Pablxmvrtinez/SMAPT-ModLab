name: Modrinth - prueba real de exportacion

on:
  pull_request:
    paths:
      - "public_catalog.py"
      - "mrpack_validator.py"
      - "modpack.py"
      - "scripts/modrinth_live_smoke.py"
      - ".github/workflows/modrinth-live-smoke.yml"
  push:
    branches: [main]
    paths:
      - "public_catalog.py"
      - "mrpack_validator.py"
      - "modpack.py"
      - "scripts/modrinth_live_smoke.py"
      - ".github/workflows/modrinth-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-modrinth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencia HTTP
        run: python -m pip install "requests>=2.31,<3"
      - name: Consultar Modrinth, exportar y validar mrpack
        run: python scripts/modrinth_live_smoke.py --output artifacts/modrinth-smoke.mrpack
      - name: Guardar paquete generado para comprobacion manual
        uses: actions/upload-artifact@v4
        with:
          name: smapt-modrinth-smoke
          path: artifacts/modrinth-smoke.mrpack
          if-no-files-found: error
          retention-days: 7
